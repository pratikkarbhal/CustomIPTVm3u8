name: Build EPG

on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST
    - cron: "30 6 * * *"    # 12:00 IST (second run in case the first one fails)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build guide.xml
        run: python build_epg.py --days 3

      - name: Sanity check (don't publish an empty guide)
        run: |
          n=$(grep -c "<programme" guide.xml || true)
          echo "Programmes in guide: $n"
          if [ "$n" -lt 50 ]; then
            echo "Guide looks empty - Jio may have blocked the request. Not committing."
            exit 1
          fi

      # Optional: also write a copy of your playlist with tvg-id tags added.
      # Change my.m3u to the name of your playlist file in the repo.
      # - name: Tag playlist with tvg-id
      #   run: python build_epg.py --patch-m3u my.m3u my_epg.m3u

      - name: Commit updated guide
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml guide.xml.gz
          # git add my_epg.m3u   # uncomment together with the optional step above
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update EPG $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
