name: Check Stream URLs

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours - adjust as you like
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  check-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg (provides ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run stream checker
        run: python check_streams.py MAH-IPTV.m3u --good working.m3u --bad dead.log

      - name: Commit results
        run: |
          git config user.name "stream-checker-bot"
          git config user.email "actions@github.com"
          git add working.m3u dead.log
          git diff --cached --quiet || git commit -m "Update working/dead stream lists [automated]"
          git push
