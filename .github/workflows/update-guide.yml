name: Update guide

on:
  schedule:
    - cron: "0 3 */2 * *"   # 2 days at 02:30 UTC, after the playlist update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout iptv-org EPG tool
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: epg-tool
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick channels from playlist
        run: python make_epg_channels.py

      - name: Download guide
        working-directory: epg-tool
        run: |
          npm install
          npm run grab --- --channels=../epg_channels.xml --output=../guide.xml --days=3 --maxConnections=5

      - name: Check guide has programmes
        run: grep -q "<programme" guide.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update guide"
            git pull --rebase
            git push
          fi
